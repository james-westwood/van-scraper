[project]
name = "van-scraper"
version = "0.1.0"
description = "Weekly search for second-hand electric high-roof vans to convert"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
